<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Oven ↔ Air fryer Converter</title>
  <style>
    :root{
      --bg:#F5F4F0;
      --primary:#BA7517;
      --secondary:#EF9F27;
      --light:#FAEEDA;
      --greenBg:#E1F5EE;
      --greenText:#085041;
      --muted:#888780;
      --white:#FFFFFF;
      --text:#1F1F1F;
      --border:#E8E6E1;
      --shadow:0 12px 40px rgba(0,0,0,0.08);
      --radius:24px;
      --focus: rgba(186,117,23,0.35);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, system-ui, sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    a{ color:inherit; }
    button, input{ font:inherit; }
    .sr-only{
      position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
    }

    .app{
      min-height:100%;
      padding:22px 14px 34px;
      display:flex;
      justify-content:center;
    }

    .container{
      width:100%;
      max-width:1200px;
    }

    /* Header */
    .hero{
      padding:26px 18px;
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(186,117,23,0.06), rgba(186,117,23,0.00));
      border: 1px solid rgba(232,230,225,0.7);
      margin-bottom:16px;
    }

    .heroRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .heroIcon{
      width:48px; height:48px;
      border-radius: 16px;
      background: rgba(250,237,219,0.55);
      border:1px solid rgba(232,230,225,0.9);
      display:grid;
      place-items:center;
      font-size:22px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      user-select:none;
    }
    .heroTitleWrap{
      flex:1;
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
    }
    .heroTitle{
      font-weight: 800;
      letter-spacing: -0.02em;
      font-size: clamp(22px, 3.5vw, 34px);
      margin:0;
      line-height:1.1;
    }
    .heroSubtitle{
      margin:0;
      color:var(--muted);
      font-size:14.5px;
      line-height:1.35;
      max-width: 60ch;
    }

    /* Layout */
    .grid{
      display:grid;
      gap:14px;
      grid-template-columns: 1fr;
      align-items:start;
      margin-top:14px;
    }

    @media (min-width: 920px){
      .grid{ grid-template-columns: 1fr 1fr; gap:18px; }
    }

    .card{
      background: var(--white);
      border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .cardInner{
      padding:16px;
    }
    @media (min-width: 560px){
      .cardInner{ padding:18px; }
    }

    /* Sections */
    .sectionTitle{
      font-size:14px;
      color:var(--muted);
      margin: 2px 0 10px;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-transform:none;
    }
    .fieldLabel{
      font-size:14px;
      color:var(--muted);
      font-weight:700;
      margin: 12px 0 10px;
    }

    /* Direction */
    .dirRow{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
    }
    .dirGroup{
      display:flex;
      align-items:center;
      justify-content:center;
      flex:1;
      min-width: 0;
      padding:10px 8px;
      border-radius: 18px;
      border: 1px solid rgba(232,230,225,0.95);
      background: rgba(232,230,225,0.35);
      user-select:none;
    }
    .dirGroup strong{
      font-size:16px;
      letter-spacing:-0.01em;
    }
    .dirGroup.active{
      background: rgba(250,237,219,0.85);
      border-color: rgba(186,117,23,0.25);
      box-shadow: 0 10px 22px rgba(186,117,23,0.12);
    }
    .swapBtn{
      width:54px; height:54px;
      border-radius: 50%;
      border:1px solid rgba(232,230,225,0.95);
      background: rgba(232,230,225,0.28);
      display:grid;
      place-items:center;
      cursor:pointer;
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
      flex:0 0 auto;
      outline:none;
    }
    .swapBtn:hover{
      transform: translateY(-1px);
      background: rgba(250,237,219,0.9);
      border-color: rgba(186,117,23,0.30);
      box-shadow: 0 12px 24px rgba(0,0,0,0.06);
    }
    .swapBtn:focus-visible{
      box-shadow: 0 0 0 4px var(--focus), 0 12px 24px rgba(0,0,0,0.06);
    }
    .swapBtn span{
      font-size:20px;
      font-weight:900;
      color:var(--primary);
      user-select:none;
    }
    .dirHint{
      margin-top:6px;
      color:var(--muted);
      font-size:12.5px;
    }

    /* Inputs */
    .numInput{
      width:100%;
      height:56px;
      border-radius: 18px;
      border:1px solid rgba(232,230,225,0.95);
      background: rgba(232,230,225,0.22);
      padding: 0 14px;
      font-size: 22px;
      letter-spacing: -0.02em;
      outline:none;
      transition: box-shadow 160ms ease, border-color 160ms ease, background 160ms ease;
    }
    .numInput:focus{
      border-color: rgba(186,117,23,0.4);
      background: rgba(250,237,219,0.55);
      box-shadow: 0 0 0 4px var(--focus);
    }

    .unitPills{
      margin-top:10px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .pill{
      border-radius: 999px;
      border:1px solid rgba(232,230,225,0.95);
      background: rgba(232,230,225,0.25);
      padding: 10px 14px;
      font-weight: 800;
      color: var(--muted);
      cursor:pointer;
      user-select:none;
      transition: background 160ms ease, color 160ms ease, border-color 160ms ease, transform 160ms ease;
      outline:none;
    }
    .pill:hover{ transform: translateY(-1px); }
    .pill:focus-visible{ box-shadow: 0 0 0 4px var(--focus); }
   .pill.active{
  background: var(--amber);
  color: #fff;
  border-color: var(--amber);
}
